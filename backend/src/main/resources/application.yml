server:
  port: 8080

spring:
  application:
    name: barbearia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barbearia}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none              # o schema vem do Flyway (modelo físico); o Hibernate não altera tabelas
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false

app:
  timezone: America/Sao_Paulo
  jwt:
    # Troque em produção (mínimo 32 caracteres). Pode vir da variável de ambiente JWT_SECRET.
    secret: ${JWT_SECRET:troque-este-segredo-por-um-valor-longo-e-aleatorio-123456}
    expiracao-horas: 12
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
  # Usuários internos criados na primeira execução (se ainda não houver nenhum gestor)
  seed:
    gestor-email: gestor@barbearia.com
    gestor-senha: Admin@123
    funcionario-email: recepcao@barbearia.com
    funcionario-senha: Func@123
